; host-mcp configuration
; Copy to ~/.host-mcp.ini, which is OUTSIDE public_html, then: chmod 600 ~/.host-mcp.ini
; host-mcp looks for it in the folder above your website first, then in $HOME.

[host-mcp]

; Required. At least 24 characters. Generate one with: openssl rand -hex 32
token = "paste-your-64-character-token-here"

; Token rotation: put the old token here with an end date (UTC, YYYY-MM-DD).
; Both tokens work until that day, so you can update your clients, then remove these lines.
;previous_token = ""
;previous_token_expires = "2026-12-31"

; The folder the agent can manage. Relative paths start at the folder that holds mcp/
; (usually public_html). "~" is your home folder. Absolute paths also work.
root = "."

; Where backups, the audit log and rate-limit counters are kept.
; Default: ~/.host-mcp next to this file, or mcp/data if that cannot be created.
;data_dir = "~/.host-mcp"

; true hides every tool that changes files.
read_only = false

; Back up every file before it is changed, moved or deleted. Restore with restore_backup.
backups = true
backup_keep_days = 14
backup_max_mb = 200

; Audit log of tool calls (never file contents): all, writes or off.
audit = "all"

; Lock an IP address out for 15 minutes after this many wrong tokens. 0 turns it off.
max_failed_auth = 10

; Requests per minute per IP address, with or without a token. 0 turns it off.
rate_limit = 300

; Only allow these addresses. Exact IPs or CIDR ranges, comma separated. Empty allows all.
;allowed_ips = "203.0.113.7, 198.51.100.0/24"

; GET without a token shows the version, PHP version, extensions and limits.
; false shows only {"status": "online"}.
public_status = true
